        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
        }

            display: flex;
            animation: fadeIn 0.3s ease;
        }

            max-width: 90%;
            max-height: 90%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: popupIn 0.4s ease;
        }

<body>
    <div class="container">
        <div id="mainPage">
            <div class="title-area">
                <div class="title-image" style="width: 1400px;"></div>
            </div>
            <div class="button-container">
                <div class="main-button" id="button1"></div>
                <div class="main-button" id="button2"></div>
                <div class="main-button" id="button3"></div>
            </div>
        </div>

        <div class="popup-overlay" id="popup1">
            <div class="popup-content"></div>
        </div>

        <div class="popup-overlay" id="popup2">
            <div class="popup-content"></div>
        </div>

        <div class="popup-overlay" id="popup3">
            <div class="popup-content"></div>
        </div>
    </div>

    <script>
        document.getElementById('button1').addEventListener('click', function() {
            document.getElementById('popup1').classList.add('active');
        });

        document.getElementById('button2').addEventListener('click', function() {
            document.getElementById('popup2').classList.add('active');
        });

        document.getElementById('button3').addEventListener('click', function() {
            document.getElementById('popup3').classList.add('active');
        });

        document.querySelectorAll('.popup-overlay').forEach(popup => {
            popup.addEventListener('click', function() {
                this.classList.remove('active');
            });
        });

        document.querySelectorAll('.popup-content').forEach(content => {
            content.addEventListener('click', function(e) {
                e.stopPropagation();
                this.parentElement.classList.remove('active');
            });
        });
    </script>
</body>
</html>
